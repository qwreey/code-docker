# Single-origin split: code-server stays at / (bind-addr moved to an
# internal-only port, see code-config.default.yaml), webmanager moves to
# /manager (own internal-only port, see WEBMANAGER_ADDR). This is the only
# program listening on 0.0.0.0:80 - everything else binds loopback-only.
#
# access/error logs go to stdout/stderr (not a file nginx manages itself) so
# supervisord's stdout_logfile/stderr_logfile capture them the same way as
# every other program (see supervisord.default.conf).

worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # NGINX_LOG_LEVEL (docker-compose.yml) picks how verbose access logging
    # is - nginx-service.default.sh envsubst's the suffix below into place:
    #   errors (default) - only requests whose response status is 4xx/5xx are
    #     "loggable" (the standard nginx map/if technique below), so routine
    #     2xx/3xx traffic doesn't flood `docker compose logs`.
    #   all - every request is logged (the old behavior). The map is still
    #     defined but unused in this mode.
    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    access_log /dev/stdout combined${NGINX_ACCESS_LOG_IF};

    server {
        listen 80;

        # Web terminal WebSocket + file uploads both need these raised past
        # nginx's defaults (1MB body / 60s read timeout) or they get cut off.
        # WEBMANAGER_FILES_MAX_UPLOAD_BYTES has its own app-level limit, so 0
        # (unlimited) here just means nginx itself never becomes the cap.
        client_max_body_size 0;
        proxy_read_timeout 3600s;

        # Without this, /manager (no trailing slash) falls through to the /
        # location below instead of matching /manager/ - it would silently
        # serve code-server's index instead of webmanager's.
        location = /manager {
            return 301 /manager/;
        }

        # Trailing slash on both location and proxy_pass matters here - it's
        # what makes nginx strip the /manager prefix before forwarding.
        location /manager/ {
            proxy_pass http://127.0.0.1:81/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # code-server's real /manifest.json (code-server-autoinstall/
        # code-server/out/node/routes/vscode.js, vendored - never edit that)
        # gets intercepted here instead of falling through to location /
        # below, so webmanager can serve a copy with a "shortcuts" field
        # added (an "Open manager" jump-list entry) - see
        # webmanager/.claude/qa-request/manifest-shortcuts-plan-done.md.
        # webmanager's handler fetches the original from code-server itself
        # and merges into it, so if webmanager is down/erroring (502/503/504,
        # including connection refused) this falls back to code-server's own
        # manifest directly, same error_page idiom as
        # location = /_code_not_ready.html below.
        location = /manifest.json {
            proxy_intercept_errors on;
            error_page 502 503 504 = @manifest_fallback;
            proxy_pass http://127.0.0.1:81/manifest.json;
            proxy_set_header Host $host;
        }

        # Only reachable via the error_page fallback above - not a direct
        # route. No URI part on proxy_pass here (unlike location =
        # /manifest.json above) - nginx rejects that inside a named
        # location, and it's unnecessary anyway since the original request
        # URI (always exactly /manifest.json, since that's the only way
        # here) is forwarded as-is.
        location @manifest_fallback {
            internal;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # code-server hasn't bound to 8080 yet (container just started, or
            # it's mid-restart) - show a friendly "not ready yet" page with a
            # JS auto-retry instead of nginx's bare 502, see
            # nginx-error.*.html. Doesn't apply to /manager/ above; webmanager
            # starting up isn't the scenario this is meant to smooth over.
            error_page 502 503 504 /_code_not_ready.html;
        }

        # Served in place, not proxied - internal so it can't be hit directly
        # from outside, only via the error_page redirect above. try_files
        # picks the override file first if present, same override pattern as
        # every other config/*.default.* file, just expressed in nginx syntax
        # instead of a shell dispatcher since this is a static asset.
        location = /_code_not_ready.html {
            internal;
            root /etc/code-docker;
            try_files /nginx-error.override.html /nginx-error.default.html =502;
        }
    }
}
