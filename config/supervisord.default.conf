[supervisord]
loglevel=info
logfile=/code/.local/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:code-server]
command=/etc/code-docker/code-service.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:sshd]
command=/etc/code-docker/sshd-service.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:tailscaled]
command=/etc/code-docker/tailscale-service.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:tailscale-forward]
command=/etc/code-docker/tailscale-forward.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:tailscale-status]
command=/etc/code-docker/tailscale-status.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:webmanager]
command=/etc/code-docker/webmanager.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# The only program listening on 0.0.0.0:80 - splits / (code-server) and
# /manager (webmanager) onto one origin, both of which now bind internal-only
# ports (see code-config.default.yaml, WEBMANAGER_ADDR).
[program:nginx]
command=/etc/code-docker/nginx-service.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# Internal Caddy instance - reverse-proxies dev servers (npm run dev etc) out
# to a wildcard subdomain, see docs/dev-proxy.md and CADDY_ADAPTER_* in
# docker-compose.yml. Independent of the nginx program above (that one
# splits code-server/webmanager onto :80, this one is a separate listener
# entirely for dev-proxy exposes).
[program:caddy-adapter]
command=/etc/code-docker/caddy-adapter.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# vector tails every other program's stdout_logfile above and re-emits it
# to this program's own stdout, labeled by app_name - so this is the one
# program whose stdout stays unrotated/raw (it IS the point). stderr files
# are not tailed by vector (see vector.default.toml), only stdout.
#
# priority=1 (every other program above is 100) is deliberate: per
# supervisord's docs, lower priority numbers start FIRST and stop LAST
# ("Lower priorities indicate programs that start first and shut down
# last... Higher priorities indicate programs that start last and shut
# down first."). vector - which needs to still be tailing everyone else's
# stdout while they shut down - must have the LOWEST priority number of the
# group to guarantee it's the last one stopped. (A previous version of this
# comment/config had the ordering backwards and used priority=999, which
# made vector stop FIRST instead - visible as "stopped: vector" as the very
# first line during `docker compose down`.)
[program:vector]
command=/etc/code-docker/vector-service.sh
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[include]
files = /etc/code-docker/supervisord/*.conf
