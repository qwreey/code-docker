[supervisord]
loglevel=info
logfile=/code/.local/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Three include globs, same split idiom as router's own
# netgate/supervisord.default.conf: /etc/code-docker/supervisord.d/*.conf is
# git-tracked, populated at build time from config/supervisord.d/ - each
# program (code, sshd, webmanager, nginx, dns-local, vector) ships its
# own [program:...] file there. /etc/code-docker/supervisord/*.conf stays
# purely for a user's own runtime override/addition - empty on a fresh
# checkout, gitignored (config/supervisord/*.conf).
#
# The third one lives on the /code volume instead of in the image, so a
# program can be added *without a rebuild* - drop a [program:...] file there
# and `reload-services` (bin/, on PATH) picks it up. That's what makes a
# `mise`-installed tool usable as a managed service: mise installs into
# $HOME, which is on this same volume, so both the binary and the unit
# survive a container recreate. It's also how a side project that wants to
# run something *inside* code-docker (rather than in its own container)
# ships it - code-docker never has to learn that project's name, mirroring
# how EXTRA_INCLUDE keeps compose-level integration out of this repo.
#
# Under $UMBRELLA (/code/.local/share/code-docker/, see
# .claude/archive/home-structure-plan.md) rather than loose in /code/.local,
# which is third-party XDG territory (mise's own install root) that this
# repo doesn't own. entrypoint.sh mkdir -p's it so a fresh volume doesn't
# start with a "No file matches via include" warning for a path nothing
# created yet; an empty directory still logs that warning, exactly like the
# gitignored glob above already does on a stock install - it's a WARN, not
# an error, and supervisord starts normally (verified).
#
# Anything here runs as root, like every other supervisord program in this
# container. That grants no privilege that wasn't already there - code-server,
# sshd and every agent session in this container are root too, and /code is
# writable by all of them. It does mean a host-side user who can write the
# HOME_VOLUME bind mount gains root-in-container at the next reload, which
# was previously only true of a rebuild.
[include]
files = /etc/code-docker/supervisord.d/*.conf /etc/code-docker/supervisord/*.conf /code/.local/share/code-docker/supervisord/*.conf
