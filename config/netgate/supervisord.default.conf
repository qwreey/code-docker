[supervisord]
loglevel=info
logfile=/var/log/netgate-supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:netgate-firewall]
command=/etc/code-docker/netgate-firewall.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:squid]
command=/etc/code-docker/netgate-squid.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# Structured the same way as the main image's config/supervisord.default.conf
# (see CLAUDE.md's "process model") - this [include] is what lets a future
# router feature (tailscale/Caddy/tinyauth, see
# .claude/backlog/functional-router-plan.md - out of scope for now) drop in
# new [program:...] sections here without netgate needing a rewrite. Empty
# on a fresh checkout - config/netgate/supervisord/*.conf is gitignored the
# same way the main image's config/supervisord/*.conf is.
[include]
files = /etc/code-docker/netgate/supervisord/*.conf
