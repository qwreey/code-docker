[program:dns-local]
command=/etc/code-docker/dns-local.sh
priority=100
; dns-local.default.sh backgrounds a dnsmasq child and stays alive itself as
; a router-IP-refresh loop - stopasgroup/killasgroup make sure a supervisord
; stop/restart signals both processes, not just the script's own PID.
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
