# The only program listening on 0.0.0.0:80 - splits / (code-server) and
# /manager (webmanager) onto one origin, both of which now bind internal-only
# ports (see code-config.default.yaml, WEBMANAGER_ADDR).
[program:nginx]
command=/etc/code-docker/override exec nginx/nginx-service.default.sh
priority=100
; nginx-service.default.sh stays alive as a peer-address refresh loop with
; nginx as its child (see NGINX_ALLOWED_PEERS there) - stopasgroup/killasgroup
; make sure a stop/restart signals both.
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
