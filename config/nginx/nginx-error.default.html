<!--
  code-server upstream(127.0.0.1:8080)이 아직 뜨지 않았을 때 nginx가 502/503/504
  대신 보여주는 페이지 - nginx.default.conf의 `location /`에 걸린
  `error_page 502 503 504 /_code_not_ready.html;`이 이 파일을 가리킵니다.
  정적 파일이라 envsubst 렌더링을 거치지 않으므로, 필요하면 이 파일 자체를
  nginx-error.override.html로 복사해 자유롭게 고쳐도 됩니다(재빌드 필요).
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>code-server 준비 중</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    width: 100%;
    background: #1e293b;
    border-radius: 12px;
    padding: 28px 28px 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
  }
  .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid #334155;
    border-top-color: #38bdf8;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 8px; color: #94a3b8; }
  .status {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #334155;
    font-size: 13px;
    color: #64748b;
  }
  .status strong { color: #94a3b8; }
  .row {
    margin-top: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button, a.button {
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    text-decoration: none;
    display: inline-block;
  }
  .primary { background: #0ea5e9; color: #fff; }
  .secondary { background: #334155; color: #e2e8f0; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>code-server가 아직 준비되지 않았습니다</h1>
    <p>컨테이너가 시작하는 중이거나 code-server가 재시작 중일 수 있습니다. 잠시 후 자동으로 다시 확인합니다.</p>
    <div class="status">
      <span id="status-text">확인 중...</span>
      · 시도 <strong id="attempt-count">0</strong>회
    </div>
    <div class="row">
      <button id="retry-now" class="primary" type="button">지금 다시 확인</button>
      <a class="button secondary" id="manager-link" href="/manager/" target="_blank" rel="noopener">webmanager에서 로그 보기</a>
    </div>
  </div>
  <script>
    (() => {
      const RETRY_INTERVAL_MS = 3000;
      const statusText = document.getElementById("status-text");
      const attemptCount = document.getElementById("attempt-count");
      const retryButton = document.getElementById("retry-now");
      let attempts = 0;
      let checking = false;

      async function check() {
        if (checking) return;
        checking = true;
        retryButton.disabled = true;
        statusText.textContent = "확인 중...";
        attempts += 1;
        attemptCount.textContent = String(attempts);

        try {
          const res = await fetch(location.href, { cache: "no-store" });
          if (res.ok) {
            statusText.textContent = "준비 완료 - 새로고침합니다...";
            location.reload();
            return;
          }
          statusText.textContent = `아직 준비되지 않음 (HTTP ${res.status})`;
        } catch {
          statusText.textContent = "연결할 수 없음";
        } finally {
          checking = false;
          retryButton.disabled = false;
        }
      }

      retryButton.addEventListener("click", check);
      setInterval(check, RETRY_INTERVAL_MS);
      check();
    })();
  </script>
</body>
</html>
