# Single-origin split: code-server stays at / (bind-addr set via
# CODE_SERVER_BIND_ADDR, default the `private` docker network alias - see
# code-runner.default.sh, NOT code-config.default.yaml), webmanager moves to
# /manager (own address via WEBMANAGER_ADDR, same default). This is the only
# program listening on 0.0.0.0:80 - everything else binds to `private` by
# default specifically so tailscaled's automatic same-port forwarding to
# 127.0.0.1 (see docs/tailscale.md) never reaches them directly.
# nginx-service.default.sh envsubst's the same CODE_SERVER_BIND_ADDR/
# WEBMANAGER_ADDR values into the proxy_pass targets below, so overriding
# either moves nginx's upstream along with it - no separate place to keep in
# sync.
#
# access/error logs go to stdout/stderr (not a file nginx manages itself) so
# supervisord's stdout_logfile/stderr_logfile capture them the same way as
# every other program (see supervisord.default.conf).

worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # NGINX_LOG_LEVEL (docker-compose.yml) picks how verbose access logging
    # is - nginx-service.default.sh envsubst's the suffix below into place:
    #   errors (default) - only requests whose response status is 4xx/5xx are
    #     "loggable" (the standard nginx map/if technique below), so routine
    #     2xx/3xx traffic doesn't flood `docker compose logs`.
    #   all - every request is logged (the old behavior). The map is still
    #     defined but unused in this mode.
    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    access_log /dev/stdout combined${NGINX_ACCESS_LOG_IF};

    # TRUSTED_PROXIES (docker-compose.yml, comma-separated IP/CIDR list,
    # empty by default) - marks upstream reverse proxies (e.g. your external
    # Caddy) whose X-Forwarded-For is trusted to derive the real client IP
    # ($remote_addr, used by access_log/proxy_set_header downstream) instead
    # of leaving it as the proxy's own IP. Empty means no `set_real_ip_from`
    # entries, so this has no effect - current behavior unchanged.
    ${NGINX_TRUSTED_PROXIES_DIRECTIVES}
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # NGINX_BLOCK_LOOPBACK (docker-compose.yml, default "true") - tailscaled
    # auto-forwards any tailnet connection with no `tailscale serve` rule to
    # the same port number on 127.0.0.1 (see docs/tailscale.md); this
    # container has no serve rule for port 80, so without this a tailnet
    # peer could reach nginx (and through it, code-server/webmanager) with
    # none of the reverse-proxy forward-auth this container assumes sits in
    # front of it. $server_addr is the local address a request was accepted
    # on, so this only catches the loopback-forwarded path - docker's
    # host-port publish still works normally (that traffic arrives on the
    # container's real interface IP, never loopback). Set to "false" if you
    # deliberately proxy into this container via 127.0.0.1 yourself (e.g.
    # your own local stunnel/socat in front of nginx) and need that to keep
    # working.
    map $server_addr $code_docker_loopback_blocked {
        ${NGINX_LOOPBACK_BLOCK_MAP}
    }

    # ALLOWED_HOSTS (docker-compose.yml, empty by default = no check) -
    # nginx-service.default.sh builds the map body below from the
    # comma-separated env var. This is a best-effort backstop against
    # accidentally reaching this container's directly-published port 80
    # without going through the intended reverse proxy (e.g. an internet
    # scanner hitting the host IP directly) - it is NOT spoof-proof, since
    # Host is a client-controlled header, not a network-layer fact. See
    # NGINX_BLOCK_LOOPBACK above for the actual unspoofable defense (against
    # tailscale's automatic loopback forwarding specifically).
    map $host $code_docker_host_allowed {
        ${NGINX_ALLOWED_HOSTS_MAP}
    }

    server {
        listen 80;

        if ($code_docker_loopback_blocked) {
            return 403 "blocked: reached via tailscale's automatic loopback forwarding, not the published port - see NGINX_BLOCK_LOOPBACK in example-env\n";
        }
        if ($code_docker_host_allowed = 0) {
            return 403 "Host not allowed - see ALLOWED_HOSTS in example-env\n";
        }

        # Web terminal WebSocket + file uploads both need these raised past
        # nginx's defaults (1MB body / 60s read timeout) or they get cut off.
        # WEBMANAGER_FILES_MAX_UPLOAD_BYTES has its own app-level limit, so 0
        # (unlimited) here just means nginx itself never becomes the cap.
        client_max_body_size 0;
        proxy_read_timeout 3600s;

        # Without this, /manager (no trailing slash) falls through to the /
        # location below instead of matching /manager/ - it would silently
        # serve code-server's index instead of webmanager's.
        location = /manager {
            return 301 /manager/;
        }

        # Trailing slash on both location and proxy_pass matters here - it's
        # what makes nginx strip the /manager prefix before forwarding.
        location /manager/ {
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM}/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # code-server's real /manifest.json (code-server-autoinstall/
        # code-server/out/node/routes/vscode.js, vendored - never edit that)
        # gets intercepted here instead of falling through to location /
        # below, so webmanager can serve a copy with a "shortcuts" field
        # added (an "Open manager" jump-list entry) - see
        # webmanager/.claude/qa-request/manifest-shortcuts-plan-done.md.
        # webmanager's handler fetches the original from code-server itself
        # and merges into it, so if webmanager is down/erroring (502/503/504,
        # including connection refused) this falls back to code-server's own
        # manifest directly, same error_page idiom as
        # location = /_code_not_ready.html below.
        location = /manifest.json {
            proxy_intercept_errors on;
            error_page 502 503 504 = @manifest_fallback;
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM}/manifest.json;
            proxy_set_header Host $host;
        }

        # Only reachable via the error_page fallback above - not a direct
        # route. No URI part on proxy_pass here (unlike location =
        # /manifest.json above) - nginx rejects that inside a named
        # location, and it's unnecessary anyway since the original request
        # URI (always exactly /manifest.json, since that's the only way
        # here) is forwarded as-is.
        location @manifest_fallback {
            internal;
            proxy_pass http://${NGINX_CODE_SERVER_UPSTREAM};
            proxy_set_header Host $host;
        }

        # The same-origin stub that a PWA jump-list shortcut aimed at another
        # origin has to point at - webmanager redirects /goto/<id> to the URL
        # the matching WEBMANAGER_MANIFEST_SHORTCUT_<ID> declared (see
        # webmanager/backend/internal/manifestpatch/shortcuts.go for why a
        # shortcut cannot name another origin directly). No URI part on
        # proxy_pass, unlike /manager/ above: the handler is registered at
        # /goto/{id}, so the prefix must survive the hop rather than be
        # stripped.
        location /goto/ {
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM};
            proxy_set_header Host $host;
        }

        # File share (WebDAV) - webmanager's internal/webdavshare, off by
        # default and fail-closed (it answers 404 until a password is set in
        # the File share tab), so these locations existing costs nothing
        # until someone turns the share on.
        #
        # Two locations, not one prefix: a client pointed at ".../webdav"
        # (no trailing slash) issues a PROPFIND on exactly that path, and a
        # 301 is not reliably followed for non-GET methods - so the bare
        # path has to reach the backend directly rather than redirect. No
        # URI part on either proxy_pass: the /webdav prefix must survive the
        # hop, because the handler strips it itself and echoes it back in
        # every <D:href> of a PROPFIND response. Rewriting it here would
        # make those hrefs point somewhere the client can't follow.
        #
        # NOTE: on THIS port the share sits on the same origin as
        # code-server, which is normally behind your outer reverse proxy's
        # forward-auth - and WebDAV clients can't do an SSO redirect, so
        # you'd have to exclude this path there for it to work at all.
        # Prefer the dedicated port below plus a router vhost, where the
        # exclusion is per-hostname instead of per-path. See docs/tips/webdav.md.
        location = /webdav {
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM};
            # $http_host, not $host, and that difference is load-bearing:
            # $host drops the port, while MOVE/COPY carry a full absolute
            # URL in their Destination header that x/net/webdav compares
            # against r.Host - a mismatch is answered 502, so on any
            # non-default port every rename would fail (measured).
            proxy_set_header Host $http_host;
            # Streamed straight through: an upload is a single PUT that can
            # be gigabytes, and the default (buffer the whole body to disk
            # before forwarding) would both stall the transfer and need that
            # much scratch space.
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /webdav/ {
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM};
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Dev Proxy (/exports/) and router-manager's admin API (/tailscale/,
        # /dev-proxy/, /router-auth/) used to be proxied through from here -
        # router now terminates host:80 directly and handles both itself
        # (see router/.claude/router-nginx-hardening-plan.md), so this
        # nginx no longer needs to know about either. webmanager's Tailscale/
        # Dev Proxy tabs now call router's own nginx at /router/api/... via
        # its own /router/ location - not this one.

        location / {
            proxy_pass http://${NGINX_CODE_SERVER_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # code-server hasn't bound to 8080 yet (container just started, or
            # it's mid-restart) - show a friendly "not ready yet" page with a
            # JS auto-retry instead of nginx's bare 502, see
            # nginx-error.*.html. Doesn't apply to /manager/ above; webmanager
            # starting up isn't the scenario this is meant to smooth over.
            error_page 502 503 504 /_code_not_ready.html;
        }

        # Served in place, not proxied - internal so it can't be hit directly
        # from outside, only via the error_page redirect above. try_files
        # picks the override file first if present, same override pattern as
        # every other config/*.default.* file, just expressed in nginx syntax
        # instead of a shell dispatcher since this is a static asset.
        location = /_code_not_ready.html {
            internal;
            root /etc/code-docker/nginx;
            try_files /nginx-error.override.html /nginx-error.default.html =502;
        }
    }

    # WebDAV-only listener (NGINX_WEBDAV_PORT, default 82). This exists so a
    # router vhost (ROUTER_VHOST_<NAME>="dav.example.com=code-docker:82") can
    # give the file share a hostname of its own: a vhost's upstream is a bare
    # host[:port] with no path, so pointing one at port 80 above would publish
    # code-server on that hostname too. Here everything except /webdav is a
    # 404, so the hostname carries the share and nothing else - and excluding
    # it from your outer forward-auth (which WebDAV clients require, see
    # docs/tips/webdav.md) is then a whole-host rule instead of a path rule.
    #
    # This container publishes no host ports at all (see docker-compose.yml),
    # so this port is reachable only from code-docker-internal. It is also
    # only ever a 404 until the share is enabled AND given a password.
    #
    # Deliberately no ALLOWED_HOSTS check here, unlike port 80: the whole
    # point is to be reached under a *different* hostname than code-server's,
    # so that allowlist would reject exactly the traffic this block is for.
    server {
        listen ${NGINX_WEBDAV_PORT};
        server_name _;

        if ($code_docker_loopback_blocked) {
            return 403 "blocked: reached via loopback forwarding, not the published port - see NGINX_BLOCK_LOOPBACK in example-env\n";
        }

        client_max_body_size 0;
        proxy_read_timeout 3600s;

        # $http_host rather than $host - see the identical pair on port 80
        # above for why the port must survive.
        location = /webdav {
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM};
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /webdav/ {
            proxy_pass http://${NGINX_WEBMANAGER_UPSTREAM};
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
