# vector pipeline: tail every program's rotated stdout log file, label each
# event with the program's name, add a best-effort log level, then:
#   - re-emit everything to this program's own stdout, labeled `[app_name] ...`
#     (this is what makes `docker compose logs` readable again now that every
#     other program's stdout_logfile points at a real file instead of
#     /dev/fd/1 - see supervisord.default.conf)
#   - additionally write a structured JSONL copy per day under
#     /code/.local/share/code-docker/vector/logs/ for webmanager's Logs page
#     to read directly

data_dir = "/code/.local/share/code-docker/vector/state"

[sources.app_logs]
type = "file"
# stderr is tailed too - tailscaled writes its login auth URL (and all its
# other diagnostics) there exclusively, and it needs to keep reaching
# `docker compose logs`/the webmanager Logs page the way it did before this
# session's stdout_logfile-to-file change (previously supervisord passed
# both fds straight to the container's own stdout).
include = ["/var/log/*/stdout.log*", "/var/log/*/stderr.log*"]

# vector now starts before the programs it tails (see supervisord.default.conf
# priority=1 - needed so it's the LAST to stop, not the first), so at its
# initial directory scan most stdout.log files are freshly created and empty.
# The default "checksum" fingerprint strategy needs at least one complete
# line before it can fingerprint a file at all, and once a file is skipped
# for being "too small to fingerprint" it isn't reliably retried later - so
# whichever program hadn't logged a full line yet at that first scan (varies
# run to run) went missing from `docker compose logs`/webmanager Logs
# entirely for that boot. device_and_inode sidesteps this: it identifies
# files by OS-level device+inode rather than content, so a brand-new empty
# file is trackable immediately. This is safe for our rotation scheme
# specifically because supervisord rotates by rename (stdout.log ->
# stdout.log.1, fresh stdout.log created) rather than copytruncate, so a
# rotated file keeps its own inode instead of having it reused in place -
# the exact case where device_and_inode is normally unsafe.
fingerprint.strategy = "device_and_inode"

# Extracts app_name from the tailed file's path, e.g.
# "/var/log/code/stdout.log" (or a rotated "...stdout.log.1") -> "code".
# Using the second-to-last path segment (rather than a fixed index) keeps
# this correct regardless of rotation suffix and independent of whether the
# path is absolute.
[transforms.tag_app_name]
type = "remap"
inputs = ["app_logs"]
source = '''
path_parts = split!(.file, "/")
.app_name = path_parts[-2]
'''

# Best-effort log level. Most of these programs' raw stdout has no explicit
# level marker, so this is a heuristic substring match, not a real parser -
# lines that happen to contain "error"/"fail"/"fatal"/"warn" anywhere in the
# message will be tagged accordingly, everything else defaults to "info".
[transforms.tag_level]
type = "remap"
inputs = ["tag_app_name"]
source = '''
msg_lower = downcase!(.message)
if contains(msg_lower, "error") || contains(msg_lower, "fatal") || contains(msg_lower, "fail") {
  .level = "error"
} else if contains(msg_lower, "warn") {
  .level = "warn"
} else {
  .level = "info"
}
'''

# Some programs (code-server chief among them) intermittently write a
# completely empty stdout line - once format_console below prepends
# "[app_name] ", these turn into a bare "[app_name] " with nothing after it:
# pure noise in `docker compose logs`/the webmanager Logs page, carrying no
# information. Filtered generically (blank/whitespace-only message) rather
# than program-specific like filter_tailscaled below, since this isn't a
# code-server quirk specifically - any program's stdout can end up with a
# stray blank line.
[transforms.filter_blank_lines]
type = "filter"
inputs = ["tag_level"]
condition = '''
strip_whitespace(to_string!(.message)) != ""
'''

# tailscaled is uniquely chatty compared to every other program here - a
# single restart alone logs dozens of internal-plumbing lines (DNS mode
# selection, WireGuard device setup, control-plane routine tracing, etc.),
# none of which carry decision-relevant information, and steady-state
# runtime chatter (magicsock/netcheck/derp/route-monitor lines) can run into
# the hundreds of thousands of lines a day even when idle (measured on this
# project's own host: journalctl -u tailscaled had 393,830 lines, of which
# only 403 were an actual ipn-state-transition/auth-URL/fatal-error signal).
# This isn't specific to this project or a container artifact - it's a
# long-standing, widely-reported upstream issue tailscale's own team
# acknowledged and never actually fixed (they don't use log levels, so their
# own suggested workaround is external filtering, same idea as this
# transform): https://github.com/tailscale/tailscale/issues/282 (real-world
# reports there include 200GB of accumulated tailscaled logs, and the same
# "magicsock: derp-N does not know about peer [...], removing route" line
# repeating every 2-3 seconds for months).
#
# Unlike nginx's NGINX_LOG_LEVEL, tailscaled has no status-code-like field to
# filter on, so this is an allowlist of substrings (safer than a blocklist -
# tailscaled's plumbing lines vastly outnumber, and could outlive, any list
# of patterns we keep in sync) rather than a level check. TAILSCALE_LOG_LEVEL
# (docker-compose.yml), read live per-event via get_env_var so no
# envsubst/restart is needed to change it:
#   errors (default) - only the allowlisted lines below pass through for the
#     tailscaled program specifically; every other program's events are
#     untouched.
#   all - no filtering, tailscaled's full output passes through like every
#     other program (previous behavior).
[transforms.filter_tailscaled]
type = "filter"
inputs = ["filter_blank_lines"]
condition = '''
msg = to_string!(.message)
.app_name != "tailscaled" ||
  (get_env_var("TAILSCALE_LOG_LEVEL") ?? "errors") == "all" ||
  # ipn state transitions (NeedsLogin/Starting/Running/...) - the actual
  # connectivity narrative, without the internals behind each transition.
  contains(msg, "Switching ipn state") ||
  # The login/auth-URL flow (first-time login, or after a key expires) -
  # "To authenticate, visit:" plus the tab-indented URL line printed right
  # after it, whichever login server is configured (not just tailscale.com's,
  # since TAILSCALE_LOGIN_SERVER can point at a self-hosted Headscale).
  contains(msg, "To authenticate") ||
  contains(msg, "Received auth URL") ||
  contains(msg, "AuthURL") ||
  (starts_with(msg, "\t") && contains(msg, "https://")) ||
  contains(msg, "Success.") ||
  contains(msg, "Fatal")
'''

# console sink's "text" codec only ever prints the `message` field, so the
# "[app_name] message" label has to be baked into `message` itself. Done in
# a separate transform (rather than in tag_level above) so the unmodified
# original message still reaches the webmanager_logs sink below.
[transforms.format_console]
type = "remap"
inputs = ["filter_tailscaled"]
source = '''
.message = "[" + string!(.app_name) + "] " + string!(.message)
'''

[sinks.console]
type = "console"
inputs = ["format_console"]
target = "stdout"
encoding.codec = "text"

# Structured JSONL, one file per day. This is a fixed contract webmanager's
# backend reads directly (no vector API involved): every line is a JSON
# object with exactly these 4 fields - timestamp (RFC3339Nano, vector's
# default event timestamp field), app_name, level ("info"|"warn"|"error"),
# message (the original, unmodified log line). `encoding.only_fields`
# strips vector's other auto-added fields (file, host, source_type).
[sinks.webmanager_logs]
type = "file"
inputs = ["filter_tailscaled"]
path = "/code/.local/share/code-docker/vector/logs/%Y-%m-%d.jsonl"
encoding.codec = "json"
encoding.only_fields = ["timestamp", "app_name", "level", "message"]
