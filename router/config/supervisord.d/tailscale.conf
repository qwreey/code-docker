# Built-in program definitions for the tailscale feature area, loaded via
# router/config/netgate/supervisord.default.conf's [include] (see that
# file's comment on the two include globs' split). Three single-
# responsibility programs, same idiom the main image's own tailscale
# programs used before this migration (see root CLAUDE.md's "tailscale"
# section) - deliberately not merged, so e.g. editing config.yaml and
# restarting tailscale-forward never touches the tailscaled login session.
# No separate tailscale-status program here - router-manager's own HTTP API
# (router/backend) replaces that role instead of a status.json-writing
# shell script.

[program:tailscaled]
command=/etc/code-docker/tailscale-service.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:tailscale-forward]
command=/etc/code-docker/tailscale-forward.sh
priority=110
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:tailscale-publish]
command=/etc/code-docker/tailscale-publish.sh
priority=110
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
