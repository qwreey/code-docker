# router's own forward-auth for individual Dev Proxy exposes - see
# router/config/tinyauth/tinyauth.default.sh and docs/dev-proxy.md#인증.
# Runs the official tinyauth binary directly (router/Dockerfile extracts it
# from ghcr.io/tinyauthapp/tinyauth) instead of a separate compose service.

[program:tinyauth]
command=/etc/router/tinyauth.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
