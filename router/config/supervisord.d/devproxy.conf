# Dev Proxy feature area: the internal Caddy instance (see
# router/config/caddy-adapter/caddy-adapter.default.sh, moved here from
# code-docker - .claude/backlog/functional-router-plan.md's "Dev Proxy
# Caddy도 router로 이관"). router-manager (config/supervisord.d/
# router-manager.conf) is what actually manages this instance's *.caddy
# fragments via its admin API - see router/backend/internal/devproxy.

[program:caddy-adapter]
command=/etc/code-docker/caddy-adapter.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
