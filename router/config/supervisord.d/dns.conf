# DNS forwarder+cache for code-docker/dind - see
# .claude/backlog/router-dns-plan.md. code-docker-dind's own apply_nameserver
# loop points its /etc/resolv.conf at this program's listen address directly
# (router's own IP on code-docker-internal); code-docker itself forwards to
# it indirectly through its own local dns-local resolver instead - see root
# CLAUDE.md's .claude/backlog/dns-local-servfail-fix.md.

[program:dns]
command=/etc/router/dns.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
