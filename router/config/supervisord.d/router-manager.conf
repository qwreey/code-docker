# router-manager: this feature area's own Go backend (see
# router/backend/main.go, router/plan.md). Separate program from
# tailscaled/tailscale-forward/tailscale-publish (config/supervisord.d/
# tailscale.conf) since it's not tailscale-specific - it'll grow to serve
# Dev Proxy/tinyauth endpoints too in later phases.

[program:router-manager]
command=/usr/local/bin/router-manager
priority=100
# Absolute path so it doesn't depend on supervisord's own cwd (same reason
# webmanager's own dispatcher script exports WEBMANAGER_STATIC_DIR as an
# absolute path rather than relying on the Go binary's "./static" default).
environment=ROUTER_MANAGER_STATIC_DIR="/etc/code-docker/router-manager/static"
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
