# DNS forwarder+cache for code-docker/dind - see
# .claude/backlog/router-dns-plan.md for why this exists: code-docker-internal
# is `internal: true`, so Docker's own embedded DNS (127.0.0.11 inside every
# container) refuses to forward queries externally - a Docker feature, not a
# bug, but it means code-docker/dind can't resolve any hostname at all via
# their own embedded resolver. router is NOT on an internal-only network
# (also attached to code-docker-external), so its own embedded DNS resolves
# normally - this just re-exposes that working resolver to code-docker-internal.

# Keep dnsmasq in the foreground so supervisord can track/restart it, and
# don't run its DHCP server (unused here).
no-daemon
port=53

# Use this container's own /etc/resolv.conf as the upstream server list
# (Docker fills this in from the host's own resolvers at container-create
# time, same "ExtServers" mechanism the code-docker/dind containers used to
# rely on directly before this existed) - no hardcoded public DNS IP needed,
# same "router doesn't need to know what's actually out there" principle
# egress filtering already follows. This is dnsmasq's own default behavior
# (reads/watches /etc/resolv.conf unless no-resolv is set) - resolv-file=
# just makes the choice explicit; do NOT add no-resolv, it disables reading
# resolv-file entirely rather than pointing it elsewhere.
resolv-file=/etc/resolv.conf

# Standard dnsmasq hygiene: don't forward single-label queries upstream
# (they're almost never valid public names), and don't forward reverse
# lookups for RFC1918/link-local ranges (nothing upstream can answer them
# usefully anyway).
domain-needed
bogus-priv

cache-size=1000

# Content blocklist, DNS-level - replaces the old squid intercept/SNI-block
# approach (removed - see .claude/backlog/router-dns-plan.md's "2부" for why:
# squid's ssl-bump anti-spoofing check false-positives on CDN-style domains
# with rotating IP pools, e.g. registry-1.docker.io, breaking `docker pull`).
# addn-hosts reads a hosts-format file and answers 0.0.0.0 for anything
# listed - the StevenBlack/hosts file this repo already downloads at build
# time (see Dockerfile) is exactly that format, so no conversion is needed
# anymore either.
#
# No addn-hosts= line here anymore (used to point straight at
# blocklist.default.hosts) - dns.default.sh now seeds a *managed, hash-
# tracked* copy of it under /var/lib/code-docker-router/dns/blocklist-sources/
# and passes every file in that directory (plus any custom sources/custom-
# hosts a user has added via router-manager's own DNS tab) as its own
# --addn-hosts= command-line flag instead. See
# router/.claude/dns-blocklist-management-plan.md for why: a static line
# baked in at build time can't reflect "the web UI just added a new source"
# or "the image shipped an updated blocklist, offer to pull it" - both need
# a runtime decision point this file, being copied in wholesale at build
# time, structurally can't provide.
