# netgate's own firewall rules - see .claude/backlog/egress-netgate-plan.md
# and docs/egress-netgate.md for the full design. Read by
# config/netgate/firewall.default.sh (via yq) every reapply cycle - no
# rebuild needed to change this file if you're using
# config/netgate/config.override.yaml (a full container recreate of
# code-docker-router is still required, same as any other config change -
# see CLAUDE.md's override pattern).

# Ordered outbound allow/block CIDR rules for FORWARD traffic (i.e.
# everything code-docker/dind send through netgate as their default
# gateway). iptables chains are first-match-wins, so this list is applied
# top to bottom in order, not as a flat set - a specific ACCEPT exception
# must be listed BEFORE the broader block it carves an exception out of, or
# it never gets reached. See the plan doc's "순서 있는 allow/block 레이어".
#
# No exception entry is needed for code-docker-internal's own subnet
# (code-docker<->dind, code-docker<->router) - same-subnet traffic uses the
# connected route and never enters the FORWARD chain at all, verified in
# this phase's own testing (see docs/egress-netgate.md).
#
# Default: block RFC1918 private ranges + link-local + loopback. Everything
# else (the public internet) falls through to the implicit ACCEPT at the
# end of the chain (no catch-all rule needed - this is a blocklist, not a
# whitelist, see the plan doc's "결정됨" #2).
outbound:
  - action: block
    cidr: 10.0.0.0/8
  - action: block
    cidr: 172.16.0.0/12
  - action: block
    cidr: 192.168.0.0/16
  - action: block
    cidr: 169.254.0.0/16
  - action: block
    cidr: 127.0.0.0/8

# Inbound port forwards: host <host_port> -> <target_host>:<target_port>,
# where target_host is any hostname resolvable on code-docker-internal
# (compose service name or network alias, e.g. "code-docker" or "dind").
# Generalized on purpose - not hardcoded to code-docker - so this is a
# home-router-style forwarding table, not a single special case. The
# generated FORWARD ACCEPT rule for each entry is always inserted before the
# outbound: block rules above (target_host's own IP is typically itself in
# RFC1918 range, so ordering here matters exactly the way it does for
# outbound: - see the plan doc's "인바운드" section).
#
# Empty by default now - host port 80 used to DNAT to code-docker:80 here,
# but router's own nginx listens on 80 directly as of
# router/.claude/router-nginx-hardening-plan.md, and a local listener
# always wins over PREROUTING DNAT for the same port - that entry would
# never have fired again, so it was removed rather than left as dead
# config. Add entries here for any OTHER host port you want forwarded to a
# code-docker-internal container:
#
# forwards:
#   - host_port: 8443
#     target_host: some-other-container
#     target_port: 443
forwards: []

# Egress bandwidth shaping (tc HTB, see shaping.default.sh) - a network-
# exhaustion defense distinct from outbound:'s destination-based allow/block
# above (that controls *where* traffic can go, this controls *how fast*).
# Applies to every packet leaving this container's default_iface, both
# FORWARDed (code-docker/dind) and locally-originated (router's own
# traffic) - a qdisc shapes the interface itself, not a netfilter chain.
#
# total_mbps is a hard cap on the sum of everything (0 = unlimited).
# Each services[] entry is an *independent* hard cap on one
# code-docker-internal container's own share (matched by target_host,
# resolved the same way forwards[].target_host is) - it does not borrow
# spare capacity from total_mbps or from other services, and unused total
# capacity is not redistributed to it. Both default to no limit at all:
#
# total_mbps: 100
# services:
#   - target_host: code-docker
#     limit_mbps: 50
#   - target_host: dind
#     limit_mbps: 50
bandwidth:
  total_mbps: 0
  services: []
