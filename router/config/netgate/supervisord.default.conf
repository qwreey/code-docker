[supervisord]
loglevel=info
logfile=/var/log/netgate-supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:netgate-firewall]
command=/etc/router/netgate-firewall.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# Bandwidth shaping (tc HTB) - deliberately a separate program from
# netgate-firewall above rather than folded into the same script/loop; see
# shaping.default.sh's own comment for why (iptables and tc are independent
# kernel subsystems).
[program:netgate-shaping]
command=/etc/router/netgate-shaping.sh
priority=100
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# Structured the same way as the main image's config/supervisord.default.conf
# (see CLAUDE.md's "process model") - two include globs, same split as the
# gitignore comment below explains: /etc/router/supervisord.d/*.conf is
# git-tracked, populated at build time from router/config/supervisord.d/ -
# this is where a router feature (tailscale/Caddy/tinyauth, see
# .claude/backlog/functional-router-plan.md) ships its own [program:...]
# section without netgate itself needing a rewrite. netgate/supervisord/*.conf
# stays purely for a user's own runtime override/addition - empty on a fresh
# checkout, gitignored the same way the main image's config/supervisord/*.conf
# is.
[include]
files = /etc/router/supervisord.d/*.conf /etc/router/netgate/supervisord/*.conf
