# Best-effort HTTP(S) content blocklist for netgate - see
# .claude/backlog/egress-netgate-plan.md's "액티브 방어 vs 패시브 방어" for why
# this is intentionally NOT a hard guarantee (that's the RFC1918/CIDR
# FORWARD rules in config/netgate/firewall.default.sh's job instead).
#
# Reached via config/netgate/firewall.default.sh's REDIRECT rules on
# traffic FORWARDed from code-docker-internal - NOT via an http_proxy= env
# var pointed at this container. code-docker never configures a proxy
# itself; it just can't get out any other way (see the plan doc).
#
# ${NETGATE_BLOCKLIST_PATH} is envsubst'd in by config/netgate/squid.default.sh
# before squid starts (default vs override resolved there, not here).

visible_hostname code-docker-router
pid_filename /run/squid.pid

# Plain HTTP intercept (iptables REDIRECT preserves the original
# destination via conntrack/getsockopt(SO_ORIGINAL_DST), so `intercept`
# mode - not the explicit-proxy default - is what makes dstdomain below see
# the real target instead of squid's own address).
http_port 3129 intercept

# HTTPS: peek the ClientHello's SNI (no decryption, no fake cert ever
# presented to the client - `terminate`/`splice` never invoke bump) to
# match against the same blocklist, then pass the raw TLS stream through
# unmodified. `cert=` is only present because https_port with ssl-bump
# requires SOME cert configured at parse time - it is never actually used
# to MITM a connection in this peek+splice+terminate config.
https_port 3130 intercept ssl-bump cert=/etc/squid/ssl/netgate-ca.pem

acl step1 at_step SslBump1
acl blocklist dstdomain "${NETGATE_BLOCKLIST_PATH}"
acl blocklist_sni ssl::server_name "${NETGATE_BLOCKLIST_PATH}"

ssl_bump peek step1
ssl_bump terminate blocklist_sni
ssl_bump splice all

http_access deny blocklist
http_access allow all
http_access deny manager

# This is a filter, not a caching proxy - no disk cache to manage/persist.
cache deny all
coredump_dir /var/cache/squid
