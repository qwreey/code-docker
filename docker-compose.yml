networks:
  code-docker-internal:
    name: "${PREFIX:-}code-docker-internal"
    internal: true
    # enable_ipv6: true # If you enabled ipv6 docker engine support, enable this
  code-docker-external:
    name: "${PREFIX:-}code-docker-external"
    internal: false
    # enable_ipv6: true # If you enabled ipv6 docker engine support, enable this
  code-docker-forwards:
    # Dedicated network for the tailscale `forwards:` feature (config.yaml's
    # socat listeners that pull a remote tailnet peer's port in). Kept
    # separate from code-docker-internal so forwards/publish don't share a
    # port namespace.
    name: "${PREFIX:-}code-docker-forwards"
    internal: true

services:
  code-docker:
    container_name: "${PREFIX:-}code-docker"
    hostname: code-docker
    build:
      # Change this if you cloned this docker-compose file to outside
      # ex: builds/code-docker
      context: .
      # Name resolution can fail if the host uses something like Tailscale,
      # so we work around this by using the host network only at build time.
      network: host
    restart: unless-stopped
    environment:
      # Web app name
      PWA_NAME: "yaeji-code"
      PWA_SHORT_NAME: "yaeji-code"
      # Timezone for all processes in the container (glibc reads this
      # directly via tzdata, already installed - no /etc/localtime symlink
      # or entrypoint change needed). Empty means UTC. e.g. "Asia/Seoul".
      TZ: ""
      # Locale for all processes (glibc LANG format, e.g. "ko_KR.UTF-8").
      # Left unset - the base image already behaves reasonably (C.UTF-8)
      # without it. Anything beyond C.UTF-8 needs locale-gen at build time
      # (see build.*.sh override), which this image doesn't do by default.
      # LANG: ""
      # Add docker in docker host. Uses the internal-only alias (not the
      # plain "code-docker-dind" service name) because code-docker sits on
      # both networks - resolving the bare name is ambiguous between the
      # two, and dind only actually listens on its code-docker-internal IP.
      DOCKER_HOST: "tcp://dind:2375"
      # Set to "false" to disable all tailscale integration (tailscaled +
      # forwards/publish) - the two supervisord programs stay up but do
      # nothing.
      TAILSCALE_ENABLED: "true"
      # Self-hosted control server (e.g. Headscale) for `tailscale up
      # --login-server=`. Leave unset/empty to use the official
      # tailscale.com control server instead.
      TAILSCALE_LOGIN_SERVER: "" # https://tail.qwreey.moe
      # In-container nginx (config/nginx.default.conf) access_log verbosity:
      #   errors - only log non-2xx/3xx responses (via an nginx map/if on
      #     $status), so routine traffic doesn't flood `docker compose logs`.
      #   all - log every request, combined format (the old behavior).
      NGINX_LOG_LEVEL: "errors"
      # vector's own internal diagnostic log level (its startup/healthcheck/
      # file-watch chatter - "Loading configs", "Vector has started",
      # "Starting file server", "Loaded checkpoint data", etc). Doesn't
      # touch the actual log pipeline data it carries (other programs'
      # re-emitted stdout, /code/.vector/logs/*.jsonl) - see
      # vector.default.toml for that. "warn" mirrors nginx's own
      # `error_log ... warn;` above. Use "error" for even quieter, or
      # "info"/"debug" to restore the old chatter.
      VECTOR_LOG_LEVEL: "warn"
      # Path `webmanager --env-migrate`/the startup version-mismatch check
      # read the current example-env.webmanager template from. Left unset to
      # use the image's own copy. Deliberately not settable via
      # .env.webmanager itself - that file is what gets migrated using this
      # template, so pointing to it from inside would be self-referential.
      # If you run multiple instances and want to enforce your own org
      # policy (e.g. #!important-forced keys), bind-mount a custom template
      # over this path instead of changing it - add this under the
      # `volumes:` section below:
      #   - ./custom-example-env.webmanager:/etc/code-docker/webmanager/example-env.webmanager:ro
      # WEBMANAGER_ENV_TEMPLATE_PATH: /etc/code-docker/webmanager/example-env.webmanager
    # webmanager(admin panel, port 81) settings all live in .env.webmanager,
    # not here - copy example-env.webmanager to .env.webmanager and uncomment
    # only what you need (every value already has a sane default). See the
    # webmanager section of README.md for what each tab does.
    env_file:
      - path: .env.webmanager
        required: false
    networks:
      code-docker-external: {}
      code-docker-internal:
        # Self-IP alias for the tailscale `publish:` feature (config.yaml's
        # `tailscale serve` targets). tailscaled auto re-exposes anything
        # bound to loopback/0.0.0.0 to the whole tailnet regardless of ACLs,
        # so services meant to be published deliberately (not automatically)
        # should bind here instead.
        aliases:
          - private
      code-docker-forwards:
        # Self-IP alias for the tailscale `forwards:` feature (config.yaml's
        # socat listeners) - same loopback-avoidance reasoning as `private`,
        # on its own network so local ports can't collide between forwards:
        # and publish:.
        aliases:
          - forward
    ports:
      # Expose port 80 (HTTP) externally through a reverse proxy,
      # or expose it directly, but be mindful of security settings.
      # It's recommended to use a reverse proxy with forward proxy auth
      # where possible, e.g. a web server like Caddy combined with an
      # authentication tool like Authentik.
      # An in-container nginx (see config/nginx.default.conf) now splits this
      # single port between code-server (/) and webmanager (/manager) - no
      # separate port needed for webmanager anymore.
      - 80:80
      # - 22:22
      # webmanager no longer needs its own published port - it's reachable at
      # /manager on port 80 above (nginx strips the prefix internally).
      # Uncomment this (and set WEBMANAGER_ADDR=:81 in .env.webmanager) only
      # if you want to bypass nginx and reach it directly on its own port.
      # - 81:81
    volumes:
      - ./code:/code
      - ./sshd:/etc/ssh
    cap_add:
      # Needed for debugging tools that trace other processes, e.g. gdb, btop
      - SYS_PTRACE
      # Avoids IPC-related performance bottlenecks, since IDEs make heavy
      # use of IPC (extensions, LSP, etc.)
      - IPC_LOCK
    # Change max logging size
    # Please note that without this setting,
    # log files could grow to tens of gigabytes in size.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Max size of a single log file
        max-file: "3"    # Keep a maximum of 3 rotated files
    # Use graphic backend. code-docker doesn't require this but
    # you can enable this if you need
    #devices:
    #  - /dev/dri:/dev/dri
    #  - /dev/kfd:/dev/kfd
    #group_add:
    #  - video
    #  - render

  # Create docker in docker daemon. for creating dev dockers (redis, postgres, ...)
  # WARNING: this daemon is privileged and has no auth/TLS on its socket.
  # Anyone who can reach it can create privileged containers and effectively
  # gain root on the host. dind-entrypoint.sh binds it to code-docker-internal
  # only (not code-docker-external, see below), but treat code-docker-internal
  # itself as fully trusted.
  code-docker-dind:
    container_name: "${PREFIX:-}code-docker-dind"
    hostname: code-docker-dind
    image: docker:dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Persist pulled images/containers across restarts
      - ./dind:/var/lib/docker
      # Binds the daemon to code-docker-internal only (see script) instead
      # of the stock entrypoint's hardcoded 0.0.0.0, so it's unreachable
      # from code-docker-external even though that network is attached
      # below (needed for `docker pull`).
      - ./script/dind-entrypoint.sh:/dind-entrypoint.sh:ro
    entrypoint: ["/dind-entrypoint.sh"]
    networks:
      code-docker-internal:
        # Extra name that only resolves on this network, so code-docker
        # (which is also on code-docker-external) can reach this daemon
        # unambiguously - see DOCKER_HOST above.
        aliases:
          - dind
      # code-docker-internal has no route to the internet, so this is
      # needed for `docker pull` to work.
      code-docker-external: {}
    command: ["--log-level=warn"]
