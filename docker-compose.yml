networks:
  code-docker-internal:
    name: "${PREFIX:-}code-docker-internal"
    internal: true
    # enable_ipv6: true # If you enabled ipv6 docker engine support, enable this
  code-docker-external:
    name: "${PREFIX:-}code-docker-external"
    internal: false
    # enable_ipv6: true # If you enabled ipv6 docker engine support, enable this
  code-docker-forwards:
    # Dedicated network for the tailscale `forwards:` feature (config.yaml's
    # socat listeners that pull a remote tailnet peer's port in). Kept
    # separate from code-docker-internal so forwards/publish don't share a
    # port namespace.
    name: "${PREFIX:-}code-docker-forwards"
    internal: true

services:
  code-docker:
    container_name: "${PREFIX:-}code-docker"
    hostname: code-docker
    build:
      # Change this if you cloned this docker-compose file to outside
      # ex: builds/code-docker
      context: .
      # Name resolution can fail if the host uses something like Tailscale,
      # so we work around this by using the host network only at build time.
      network: host
    restart: unless-stopped
    environment:
      # Web app name
      PWA_NAME: "yaeji-code"
      PWA_SHORT_NAME: "yaeji-code"
      # Timezone for all processes in the container (glibc reads this
      # directly via tzdata, already installed - no /etc/localtime symlink
      # or entrypoint change needed). Empty means UTC. e.g. "Asia/Seoul".
      TZ: ""
      # Locale for all processes (glibc LANG format, e.g. "en_US.UTF-8" or
      # "ko_KR.UTF-8"). Left commented out - the base image already behaves
      # reasonably (POSIX/C.UTF-8) without this being set, so most people
      # won't need it. Uncomment and set if you want a specific locale, but
      # note that locale hasn't been verified to actually be generated in
      # this image (Arch typically needs it enabled in /etc/locale.gen +
      # `locale-gen` at build time for anything beyond C.UTF-8) - you may
      # need a build.*.sh override to generate it first.
      # LANG: ""
      # Add docker in docker host. Uses the internal-only alias (not the
      # plain "code-docker-dind" service name) because code-docker sits on
      # both networks - resolving the bare name is ambiguous between the
      # two, and dind only actually listens on its code-docker-internal IP.
      DOCKER_HOST: "tcp://dind:2375"
      # Set to "false" to disable all tailscale integration (tailscaled +
      # forwards/publish) - the two supervisord programs stay up but do
      # nothing.
      TAILSCALE_ENABLED: "true"
      # Self-hosted control server (e.g. Headscale) for `tailscale up
      # --login-server=`. Leave unset/empty to use the official
      # tailscale.com control server instead.
      TAILSCALE_LOGIN_SERVER: "" # https://tail.qwreey.moe

      # --- webmanager (admin panel, port 81) settings ---
      # All of these already have sane defaults (see webmanager/backend/
      # config.go) - uncomment and set only the ones you actually need to
      # override. Full behavior of each is documented in the referenced
      # webmanager/.claude/*.md plan docs.

      # Password gate (optional, off by default) - required to unlock the
      # Terminal/File Manager tabs entirely, and to make any write action
      # elsewhere (Git Config, Tailscale, SSH Keys, Supervisor start/stop/
      # restart, etc.) require a password first. Leave unset/empty to keep
      # everything working as before (relies purely on your reverse-proxy
      # auth in front of :81).
      #
      # Must be an argon2id hash, NEVER the plaintext password - generate one
      # with the container already running:
      #
      #   docker compose exec code-docker /etc/code-docker/webmanager/webmanager --hash-password
      #
      # This prompts for the password twice (input hidden, typo-checked) and
      # prints only the resulting hash (starts with "$argon2id$") to stdout -
      # paste that whole string as the value below (or into a .env file next
      # to this docker-compose.yml as WEBMANAGER_AUTH_PASSWORD_HASH=...,
      # which is what the "${WEBMANAGER_AUTH_PASSWORD_HASH:-}" below reads
      # from - either way, then `docker compose up -d` again to apply it;
      # `docker compose restart` does NOT pick up a changed env var, only
      # `up` recreating the container does).
      #
      # Deliberately only ever read from an env var, never a file the
      # container can write to itself - so changing it always requires host
      # access to this docker-compose.yml/.env, not just a shell inside the
      # container.
      WEBMANAGER_AUTH_PASSWORD_HASH: "${WEBMANAGER_AUTH_PASSWORD_HASH:-}"

      # File manager: root path it's allowed to browse. Default is /code
      # (deliberately narrower than the whole container) - widen to "/" if
      # you want it to reach the rest of the filesystem too.
      # WEBMANAGER_FILES_ROOT: ""
      # File manager: max upload size in bytes. Default 2147483648 (2GiB).
      # WEBMANAGER_FILES_MAX_UPLOAD_BYTES: ""

      # Claude Code tab: override the `claude` binary path if it's not on
      # webmanager's PATH (e.g. installed via mise, which uses shims that
      # supervisord programs may not inherit).
      # WEBMANAGER_CLAUDE_BINPATH: ""
      # CLAUDE_CONFIG_DIR: "" # default /code/.claude

      # mise tab: override the `mise` binary path (default is the fixed
      # $HOME/.local/bin/mise mise itself installs to).
      # WEBMANAGER_MISE_BINPATH: ""

      # Projects tab: colon-separated list of root directories to scan
      # (like $PATH), e.g. "/code/Projects:/code/AndroidStudioProjects".
      # WEBMANAGER_PROJECTS_PATH: "" # default /code/Projects
      # WEBMANAGER_PROJECTS_CACHE_PATH: ""
      # WEBMANAGER_PROJECTS_STALE_AFTER: "" # default 1h
      # WEBMANAGER_PROJECTS_OLD_DAYS: "" # default 90 - staleness threshold
      # WEBMANAGER_PROJECTS_PATTERNS_PATH: "" # user-editable reclaimable-folder patterns
      # Externally-reachable code-server base URL, used to build the
      # Projects tab's "open in code-server" links (${url}/?folder=${path}).
      # Leave empty to hide that button - webmanager can't infer this on
      # its own (multi-instance/PREFIX/proxy setups vary too much).
      # WEBMANAGER_CODE_SERVER_URL: ""

      # System resource history graph (Task Manager tab): sampling interval
      # and how much history to keep.
      # WEBMANAGER_SYSTEM_HISTORY_INTERVAL_SECONDS: "" # default 5
      # WEBMANAGER_SYSTEM_HISTORY_WINDOW_MINUTES: "" # default 10

      # Code Extensions/mise recommendation list source (config/
      # recommendations.*.yaml, baked into the image at /etc/code-docker/ -
      # override by adding a config/recommendations.override.yaml file
      # instead of changing this path).
      # WEBMANAGER_RECOMMENDATIONS_DEFAULT_PATH: ""
      # WEBMANAGER_RECOMMENDATIONS_OVERRIDE_PATH: ""
      # code-server CLI flags used for --list-extensions/--install-extension
      # (must match what code-server-autoinstall actually launches with).
      # WEBMANAGER_CODE_SERVER_BIN: ""
      # WEBMANAGER_CODE_SERVER_USER_DATA_DIR: ""
      # WEBMANAGER_CODE_SERVER_EXTENSIONS_DIR: ""

      # Supervisor tab: per-program metadata (disable specific controls +
      # an explanatory note - config/supervisor-metadata.*.yaml, same
      # override pattern as recommendations above).
      # WEBMANAGER_SUPERVISOR_METADATA_DEFAULT_PATH: ""
      # WEBMANAGER_SUPERVISOR_METADATA_OVERRIDE_PATH: ""

      # Less commonly touched - these already match the rest of the
      # container's fixed layout, only relevant if you've also changed the
      # underlying paths elsewhere (SSH config, git config location, etc.).
      # WEBMANAGER_ADDR: "" # default :81 - changing this also needs the port mapping below updated
      # SUPERVISOR_SOCK: ""
      # SSH_AUTHORIZED_KEYS: ""
      # GIT_CONFIG_PATH: ""
      # SSH_CLIENT_CONFIG: ""
      # SSH_KEYS_DIR: ""
      # WEBMANAGER_SSH_KNOWN_HOSTS_PATH: ""
      # GIT_CREDENTIALS_PATH: ""
      # WEBMANAGER_STATIC_DIR: ""
      # TAILSCALE_CONFIG_PATH: "" # keep in sync with tailscale-forward's own CONFIG= path if you change this
      # SSH_SIGNING_KEY_PATH: ""
      # VECTOR_LOG_DIR: ""
      # SYSTEM_DISK_PATH: ""
      # Task Manager tab: root path for the per-top-level-directory disk
      # breakdown (a "what's using space where" view, distinct from
      # SYSTEM_DISK_PATH above) and where its scan result is cached.
      # SYSTEM_DISK_BREAKDOWN_ROOT: ""
      # WEBMANAGER_DISK_BREAKDOWN_CACHE_PATH: ""

      # Terminal tab: where user-customized on-screen keybindings/color
      # themes are saved.
      # WEBMANAGER_TERMINAL_SETTINGS_PATH: ""
      # Terminal tab: M2 named persistent sessions - how long an unpinned,
      # unattached session survives before being auto-cleaned up, and the
      # scrollback ring buffer size per session (bytes).
      # WEBMANAGER_TERMINAL_SESSION_IDLE_TIMEOUT: "" # default 30m
      # WEBMANAGER_TERMINAL_SESSION_SCROLLBACK_BYTES: "" # default 262144
      # Sidebar: where your drag-and-drop tab order is saved.
      # WEBMANAGER_SIDEBAR_ORDER_PATH: ""
    networks:
      code-docker-external: {}
      code-docker-internal:
        # Self-IP alias for the tailscale `publish:` feature (config.yaml's
        # `tailscale serve` targets). tailscaled auto re-exposes anything
        # bound to loopback/0.0.0.0 to the whole tailnet regardless of ACLs,
        # so services meant to be published deliberately (not automatically)
        # should bind here instead.
        aliases:
          - private
      code-docker-forwards:
        # Self-IP alias for the tailscale `forwards:` feature (config.yaml's
        # socat listeners) - same loopback-avoidance reasoning as `private`,
        # on its own network so local ports can't collide between forwards:
        # and publish:.
        aliases:
          - forward
    ports:
      # Expose port 80 (HTTP) externally through a reverse proxy,
      # or expose it directly, but be mindful of security settings.
      # It's recommended to use a reverse proxy with forward proxy auth
      # where possible, e.g. a web server like Caddy combined with an
      # authentication tool like Authentik.
      - 80:80
      # - 22:22
      # webmanager admin panel. No auth of its own - relies entirely on a
      # reverse proxy in front of it. Bind-address strategy (host publish vs
      # internal-only alias) is still undecided, so this is just open on
      # 0.0.0.0 for now while it's under development.
      - 81:81
    volumes:
      - ./code:/code
      - ./sshd:/etc/ssh
    cap_add:
      # Needed for debugging tools that trace other processes, e.g. gdb, btop
      - SYS_PTRACE
      # Avoids IPC-related performance bottlenecks, since IDEs make heavy
      # use of IPC (extensions, LSP, etc.)
      - IPC_LOCK
    # Change max logging size
    # Please note that without this setting,
    # log files could grow to tens of gigabytes in size.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Max size of a single log file
        max-file: "3"    # Keep a maximum of 3 rotated files
    # Use graphic backend. code-docker doesn't require this but
    # you can enable this if you need
    #devices:
    #  - /dev/dri:/dev/dri
    #  - /dev/kfd:/dev/kfd
    #group_add:
    #  - video
    #  - render

  # Create docker in docker daemon. for creating dev dockers (redis, postgres, ...)
  # WARNING: this daemon is privileged and has no auth/TLS on its socket.
  # Anyone who can reach it can create privileged containers and effectively
  # gain root on the host. dind-entrypoint.sh binds it to code-docker-internal
  # only (not code-docker-external, see below), but treat code-docker-internal
  # itself as fully trusted.
  code-docker-dind:
    container_name: "${PREFIX:-}code-docker-dind"
    hostname: code-docker-dind
    image: docker:dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Persist pulled images/containers across restarts
      - ./dind:/var/lib/docker
      # Binds the daemon to code-docker-internal only (see script) instead
      # of the stock entrypoint's hardcoded 0.0.0.0, so it's unreachable
      # from code-docker-external even though that network is attached
      # below (needed for `docker pull`).
      - ./script/dind-entrypoint.sh:/dind-entrypoint.sh:ro
    entrypoint: ["/dind-entrypoint.sh"]
    networks:
      code-docker-internal:
        # Extra name that only resolves on this network, so code-docker
        # (which is also on code-docker-external) can reach this daemon
        # unambiguously - see DOCKER_HOST above.
        aliases:
          - dind
      # code-docker-internal has no route to the internet, so this is
      # needed for `docker pull` to work.
      code-docker-external: {}
    command: ["--log-level=warn"]
