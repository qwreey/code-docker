# Optional extra Compose file, included as-is into this project - lets a locally
# cloned sibling project (e.g. builds/roblox-studio-docker, cloned the same way
# builds/code-docker itself is per docs/index.md) attach its own services to
# code-docker-internal/code-docker-router etc. without ever touching this file, so
# `git pull` on this repo never conflicts with that local customization. Defaults to
# empty-extra-include.yml, an intentionally-committed 0-byte file that's a total no-op
# when included (confirmed by direct testing) - but Compose resolves `include: path:`
# relative to wherever THIS file actually lives at runtime, not to this git repo, so in
# the recommended split-directory deploy (docs/index.md: clone into builds/code-docker/,
# copy this file out one level) that 0-byte file being committed in the repo is NOT
# enough on its own - `docker compose` fails outright (even `config`, not just
# `build`/`up`) unless empty-extra-include.yml also physically exists next to wherever
# THIS docker-compose.yml was copied to. docs/index.md's setup steps include a `touch
# empty-extra-include.yml` for exactly this reason - if that step is ever missing there,
# that's a bug, not something this comment alone fixes. To actually use the mechanism:
# create your own `extra-include.yml` (left out of version control - see .gitignore)
# containing `include:\n  - path: builds/<your-project>/<its-own-integration-file>.yml`,
# then set `EXTRA_INCLUDE=extra-include.yml` in `.env`. See
# docs/tips/roblox-studio.md for the concrete roblox-studio-docker case this was built
# for and verified against (2026-08-18).
#
# The second entry below is NOT the same mechanism, despite using the same `include:`
# keyword - router is core, always-present topology (like NETGATE_ENABLED, it has a
# behavioral opt-out but the service itself never goes away), not an optional sibling, so
# it gets its own fixed path rather than being routed through EXTRA_INCLUDE. It still
# needs the same ${BUILD_CONTEXT:-.} indirection as every other subtree's build.context
# for the same split-directory-deploy reason - router/ itself doesn't move even when
# docker-compose.yml is copied out one level, only the include path pointing at it does.
include:
  - path: ${EXTRA_INCLUDE:-empty-extra-include.yml}
  - path: ${BUILD_CONTEXT:-.}/router/docker-compose.router.yml

networks:
  code-docker-internal:
    name: "${PREFIX:-}code-docker-internal"
    internal: true
    # Requires ipv6 support enabled in the docker engine daemon.json - see
    # example-env before enabling.
    enable_ipv6: ${ENABLE_IPV6:-false}
    # Deliberately left on Docker's usual auto-assigned subnet (no ipam.config
    # pin) - a hardcoded subnet here used to collide across multiple PREFIX
    # instances on one host (each got its own network by name, but they all
    # wanted the same fixed CIDR). router's own nginx needs this network's
    # CIDR for its /exports/ internal-source deny (see ROUTER_INTERNAL_SUBNET
    # below and router/.claude/router-nginx-hardening-plan.md), but it now
    # detects it live from its own routing table at startup instead of
    # relying on a value pinned here - see nginx-service.default.sh's
    # detect_internal_subnet. Set ROUTER_INTERNAL_SUBNET explicitly only if
    # that detection ever needs overriding (e.g. router attached to a third
    # network).
  code-docker-external:
    name: "${PREFIX:-}code-docker-external"
    internal: false
    enable_ipv6: ${ENABLE_IPV6:-false}

services:
  code-docker:
    container_name: "${PREFIX:-}code-docker"
    hostname: code-docker
    build:
      # Defaults to "." (this docker-compose.yml living next to the repo).
      # If you cloned this docker-compose file to outside the repo (ex:
      # builds/code-docker), set BUILD_CONTEXT in .env instead of editing
      # this file - see example-env.
      context: "${BUILD_CONTEXT:-.}"
      # Name resolution can fail if the host uses something like Tailscale,
      # so we work around this by using the host network only at build time.
      network: host
    restart: unless-stopped
    # What each of these does, its default, and how to override it all live
    # in example-env (copy it to .env) - kept terse here to avoid
    # documenting the same variable in two places.
    environment:
      PWA_NAME: "${PWA_NAME:-code-docker}"
      PWA_SHORT_NAME: "${PWA_SHORT_NAME:-code-docker}"
      PWA_DISPLAY_MODE: "${PWA_DISPLAY_MODE:-}"
      # Named CODE_TZ/CODE_LANG here, not the bare TZ/LANG a shell would usually
      # export - Compose's ${VAR:-default} substitution prefers a variable already
      # exported in the shell invoking `docker compose` over the same-named value in
      # .env, so a plain `TZ: "${TZ:-}"` here silently ignored .env's TZ/LANG on any
      # host whose login shell already sets them (most do). script/entrypoint.sh
      # re-exports these under the real TZ/LANG names for every process it starts.
      CODE_TZ: "${CODE_TZ:-}"
      CODE_LANG: "${CODE_LANG:-}"
      # Default matches the "dind" alias below - see example-env before
      # overriding.
      DOCKER_HOST: "${DOCKER_HOST:-tcp://dind:2375}"
      NGINX_LOG_LEVEL: "${NGINX_LOG_LEVEL:-errors}"
      CODE_SERVER_BIND_ADDR: "${CODE_SERVER_BIND_ADDR:-private:8080}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      NGINX_BLOCK_LOOPBACK: "${NGINX_BLOCK_LOOPBACK:-true}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      VECTOR_LOG_LEVEL: "${VECTOR_LOG_LEVEL:-warn}"
      WEBMANAGER_ENV_TEMPLATE_PATH: "${WEBMANAGER_ENV_TEMPLATE_PATH:-/etc/code-docker/webmanager/example-env.webmanager}"
      # Egress lockdown (see .claude/backlog/egress-netgate-plan.md) - "false"
      # skips entrypoint.sh's default-route wait gate. Does NOT restore
      # code-docker-external/ports below - those are static compose topology
      # and can't be conditioned on a runtime env var, see example-env.
      NETGATE_ENABLED: "${NETGATE_ENABLED:-true}"
      # Hostname entrypoint.sh/resolv-writer resolve to find router - must
      # match the alias on code-docker-router's own networks: block below.
      # See example-env before overriding.
      ROUTER_HOSTNAME: "${ROUTER_HOSTNAME:-router}"
    # Resource-exhaustion guard: a process inside code-docker (or an agent
    # running in it) can otherwise consume unbounded host CPU/RAM. Both
    # default to "0", which Docker/Compose treat as "no limit" (confirmed:
    # `docker inspect` shows Memory=0/NanoCpus=0 for an unset limit, and
    # Compose actually drops an all-zero deploy.resources.limits block
    # entirely rather than passing 0 through) - so the out-of-the-box
    # behavior is unchanged from before this existed. Set CODE_CPU_LIMIT/
    # CODE_MEM_LIMIT in .env to actually cap it - see example-env.
    deploy:
      resources:
        limits:
          cpus: "${CODE_CPU_LIMIT:-0}"
          memory: "${CODE_MEM_LIMIT:-0}"
    # webmanager(admin panel, port 81) settings all live in .env.webmanager,
    # not here - copy example-env.webmanager to .env.webmanager and uncomment
    # only what you need (every value already has a sane default). See the
    # webmanager section of README.md for what each tab does.
    env_file:
      - path: .env.webmanager
        required: false
    networks:
      # code-docker-external deliberately NOT attached here anymore (see
      # .claude/backlog/egress-netgate-plan.md's "정정" section) - code-docker
      # must have no interface with a route to the internet of its own, or
      # code-docker-netinit setting the default route below wouldn't be a
      # real chokepoint (an agent could just... use the other interface).
      # All outbound now transits the code-docker-router service (below)
      # via the route code-docker-netinit continuously (re)plants in this
      # netns.
      code-docker-internal:
        # `private` is CODE_SERVER_BIND_ADDR/WEBMANAGER_ADDR's default bind
        # address (a dedicated non-loopback IP, see docs/tailscale.md) -
        # historically this existed so code-docker's own tailscaled could
        # publish these ports without an automatic loopback-exposure
        # workaround. Phase 4 of router/.claude/functional-router-plan.md's migration is
        # now complete (see docs/router.md's "보안" section) - code-docker
        # runs no tailscaled at all anymore, so that original reasoning no
        # longer applies. Left as the default anyway since it still works
        # and nothing forces a change; revisit only if there's a concrete
        # reason to (e.g. simplifying to a loopback bind now that nginx is
        # the only thing that needs to reach it, and nginx lives in this
        # same container).
        aliases:
          - private
    # ports: block left entirely commented out on purpose - Compose rejects
    # a `ports:` key with zero array items, so the key itself has to go too,
    # not just its entries.
    #
    # ports:
    #   code-docker is no longer attached to code-docker-external (see the
    #   networks: comment above), so publishing a host port directly on
    #   this service doesn't work anymore - Compose docs: networks with
    #   internal: true "are created without any connection to the host's
    #   network interfaces". Port 80 lives on the code-docker-router
    #   service instead now, which terminates it directly via its own
    #   nginx and reverse-proxies everything but /exports/ and /router/
    #   back to code-docker:80 (see router/.claude/router-nginx-hardening-plan.md
    #   and router's own ports: comment below). This container has NO
    #   published port of its own and is unreachable from the host except
    #   through that hop.
    #   - 22:22
    #   webmanager no longer needs its own published port - it's reachable at
    #   /manager on port 80 above (nginx strips the prefix internally).
    #   Uncomment this (and set WEBMANAGER_ADDR=:81 in .env.webmanager) only
    #   if you want to bypass nginx and reach it directly on its own port.
    #   - 81:81
    volumes:
      - "${HOME_VOLUME:-./data/code}:/code"
      - "${SSHD_VOLUME:-./data/sshd}:/etc/ssh"
    cap_add:
      # Needed for debugging tools that trace other processes, e.g. gdb, btop
      - SYS_PTRACE
      # Avoids IPC-related performance bottlenecks, since IDEs make heavy
      # use of IPC (extensions, LSP, etc.)
      - IPC_LOCK
    # Change max logging size
    # Please note that without this setting,
    # log files could grow to tens of gigabytes in size.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Max size of a single log file
        max-file: "3"    # Keep a maximum of 3 rotated files
    # Use graphic backend. code-docker doesn't require this but
    # you can enable this if you need
    #devices:
    #  - /dev/dri:/dev/dri
    #  - /dev/kfd:/dev/kfd
    #group_add:
    #  - video
    #  - render

  # Phase 1 of egress-netgate-plan.md's outbound lockdown. Owns no network
  # attachment of its own - network_mode below makes it share code-docker's
  # netns entirely (same interfaces/IP/routing table), and it uses the
  # NET_ADMIN code-docker itself deliberately never gets to keep code-docker's
  # default route pointed at router (formerly netgate). See the plan doc for
  # why code-docker stays the netns owner instead of the other way around
  # ("왜 code-docker가 계속 소유주여야 하는가").
  code-docker-netinit:
    container_name: "${PREFIX:-}code-docker-netinit"
    build:
      # netinit is now qwreey/router-docker-client's own subdirectory, built
      # directly from its git repo (Compose's native remote-git build
      # context, not a local checkout/submodule) - floating #main ref,
      # deliberately unpinned, see that repo's own CLAUDE.md for why.
      context: "https://github.com/qwreey/router-docker-client.git#main:netinit"
      network: host
    network_mode: "service:code-docker"
    cap_add:
      - NET_ADMIN
    environment:
      NETGATE_ENABLED: "${NETGATE_ENABLED:-true}"
      # Must match the alias on code-docker-router's own networks: block
      # below - see example-env before overriding.
      ROUTER_HOSTNAME: "${ROUTER_HOSTNAME:-router}"
    depends_on:
      code-docker:
        condition: service_started
    restart: unless-stopped
    # Same reasoning as code-docker's own logging: block above - without
    # this, a container that's respawned/restarted repeatedly (or just
    # left running a long time) can accumulate unbounded log file growth.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Create docker in docker daemon. for creating dev dockers (redis, postgres, ...)
  # WARNING: this daemon is privileged and has no auth/TLS on its socket.
  # Anyone who can reach it can create privileged containers and effectively
  # gain root on the host. dind-entrypoint.sh binds it to code-docker-internal
  # only, and (egress-netgate-plan.md) it's not attached to
  # code-docker-external anymore either - it manages its own default route
  # toward code-docker-router (formerly code-docker-netgate) the same way
  # code-docker-netinit does for code-docker (see below). Still, treat
  # code-docker-internal itself as fully trusted.
  code-docker-dind:
    container_name: "${PREFIX:-}code-docker-dind"
    hostname: code-docker-dind
    build:
      # code-dind/ is its own self-contained subtree (own Dockerfile), same
      # pattern as router/ - see code-dind/CLAUDE.md. Named "code-dind", not
      # "dind", so it can't collide with the DIND_VOLUME/DIND_AUTHZ_VOLUME
      # runtime data directories below (./data/dind, ./data/dind-authz by
      # default - every runtime data dir lives under repo-root data/ now,
      # separate from every source subtree, see CLAUDE.md's "docker-compose
      # topology").
      # Set BUILD_CONTEXT in .env instead of editing this file.
      context: "${BUILD_CONTEXT:-.}/code-dind"
      network: host
      # dind (no protection) | dind-authz (default - denies
      # privileged/dangerous-cap/host-namespace/out-of-/code-mount container
      # creation) | dind-authz-remap (dind-authz + userns-remap - not the
      # default, see docs/tips/dind.md's "추가 경화" section before opting in:
      # LXC-hosted Docker compatibility concerns, and /code bind-mount writes
      # need extra chown/named-volume handling). A build-stage choice rather
      # than a runtime toggle so an unwanted stage's code/config isn't even
      # present in the image - see code-dind/.claude/dind-authz-plan.md for why.
      target: "${DIND_TARGET:-dind-authz}"
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
      # Egress lockdown (see .claude/backlog/egress-netgate-plan.md) -
      # dind-entrypoint.sh's own default-route loop, same opt-out as
      # code-docker's NETGATE_ENABLED above. Does NOT restore
      # code-docker-external below - static compose topology, see
      # example-env.
      NETGATE_ENABLED: "${NETGATE_ENABLED:-true}"
      # Must match the alias on code-docker-router's own networks: block
      # below - see example-env before overriding.
      ROUTER_HOSTNAME: "${ROUTER_HOSTNAME:-router}"
    # Same resource-exhaustion guard as code-docker's own deploy: block
    # above - matters even more here, since containers created *inside*
    # dind (e.g. a stray `docker run` loop) share this one cgroup and
    # would otherwise have no ceiling at all. Default "0" (unlimited) -
    # see CODE_CPU_LIMIT's comment above and example-env.
    deploy:
      resources:
        limits:
          cpus: "${DIND_CPU_LIMIT:-0}"
          memory: "${DIND_MEM_LIMIT:-0}"
    volumes:
      # Persist pulled images/containers across restarts
      - "${DIND_VOLUME:-./data/dind}:/var/lib/docker"
      # Same host path as code-docker's own /code (HOME_VOLUME) - DinD
      # resolves bind-mount sources against ITS OWN filesystem, not the
      # client's, so a project's `./data:/data`-style compose volume only
      # works (and only round-trips through the dind-authz /code-only
      # allow-list) if dind can see /code at the same absolute path.
      - "${HOME_VOLUME:-./data/code}:/code"
      # dind-authz's live, host-editable conf.d directory (dind-authz stage
      # only - harmless no-op mount on the plain dind stage, nothing reads
      # it there). Deliberately NOT mounted into code-docker anywhere, by
      # any path - code-docker must never be able to edit the policy that
      # constrains what it can ask dind to create. Only someone with direct
      # access to the docker host's filesystem can edit this.
      - "${DIND_AUTHZ_VOLUME:-./data/dind-authz}:/etc/dind-authz.d"
    networks:
      # code-docker-external deliberately NOT attached here either
      # (egress-netgate-plan.md - same reasoning as code-docker's own
      # networks: comment above). `docker pull` etc. now goes through
      # code-docker-router via the route dind-entrypoint.sh's loop keeps
      # planting here, same mechanism as code-docker-netinit uses for
      # code-docker.
      code-docker-internal:
        # Extra name that only resolves on this network, so code-docker
        # can reach this daemon unambiguously - see DOCKER_HOST above.
        aliases:
          - dind
    command: ["--log-level=warn"]
    # Same reasoning as code-docker's own logging: block above - dockerd's
    # own stdout carries potentially high-volume daemon logging, so this is
    # if anything more important here than for the other services.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Newer Docker Engine builds install a DOCKER-INTERNAL nftables chain for
  # any `internal: true` network (code-docker-internal above) that
  # unconditionally drops FORWARD-path packets leaving that network's
  # bridge whose destination isn't inside the bridge's own subnet - this
  # blocks router's whole egress design below (router is deliberately
  # bridged across code-docker-internal/code-docker-external to forward
  # + filter traffic) at the host level, regardless of what router's own
  # iptables does internally. See docs/egress-netgate.md's "Docker의
  # DOCKER-INTERNAL 강제 격리" section for the full story and how this was
  # diagnosed. This container's only job is to keep a host-level DOCKER-USER
  # exemption in sync - DOCKER-USER is the chain Docker reserves for exactly
  # this kind of override, always evaluated before DOCKER-FORWARD/
  # DOCKER-INTERNAL.
  #
  # network_mode: host (no networks: attachment at all - it never joins
  # code-docker-internal/external) + NET_ADMIN + a read-only docker.sock
  # mount are all required just to reach the host's own netfilter tables at
  # all (a container's NET_ADMIN alone only grants admin rights within its
  # OWN netns) - this is a materially bigger trust tier than any other
  # service here except code-docker-dind, which already runs privileged
  # with an unauthenticated Docker socket of its own (see that service's
  # own comment above) - anyone who could already reach dind gets
  # host-kernel-equivalent access, so this doesn't introduce a new class of
  # risk on top of what's already accepted. Deliberately its own minimal
  # image (qwreey/router-docker-client's netfilter-fix/, see build.context
  # below) rather than added onto an existing service, so this trust tier
  # stays scoped to one tiny single-purpose container instead of expanding
  # code-docker/router's own.
  #
  # Tied to `docker compose down`/`up` on purpose instead of a host-level
  # systemd unit: the exemption's lifetime matches this container's (it
  # deletes its own rule on SIGTERM, see router-docker-client's
  # netfilter-fix/fix.sh), and running it as a compose service means a
  # multi-instance (PREFIX) deployment gets one of these automatically per
  # instance with no separate per-PREFIX systemd unit to remember to
  # install.
  code-docker-netfilter-fix:
    container_name: "${PREFIX:-}code-docker-netfilter-fix"
    build:
      # netfilter-fix is now qwreey/router-docker-client's own subdirectory,
      # built directly from its git repo (same remote-git build context
      # mechanism as code-docker-netinit above).
      context: "https://github.com/qwreey/router-docker-client.git#main:netfilter-fix"
      network: host
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # NETFILTER_FIX_* (not CODE_DOCKER_*) - the script itself is a generic
      # qwreey/router-docker-client tool now, not code-docker-specific, and its env
      # vars are named after the tool rather than this particular consumer (see that
      # repo's own CLAUDE.md and netfilter-fix/fix.sh comments).
      NETFILTER_FIX_INTERNAL_NETWORK: "${PREFIX:-}code-docker-internal"
      # Space-separated list of any OTHER internal: true networks router also needs a
      # DOCKER-USER exemption for (e.g. a sibling project's EXTRA_INCLUDE overlay
      # attaching router to a dedicated network - see example-env's own comment on this
      # var and .claude/archive/roblox-studio-vnc-isolation-plan-done.md). Left as a separate
      # env var from NETFILTER_FIX_INTERNAL_NETWORK above on purpose - see netfilter-fix/fix.sh's
      # own comment on why.
      NETFILTER_FIX_EXTRA_INTERNAL_NETWORKS: "${NETFILTER_FIX_EXTRA_INTERNAL_NETWORKS:-}"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # router - the network-boundary container for code-docker. Started as
  # Phase 2 of egress-netgate-plan.md's outbound lockdown (service used to
  # be named code-docker-netgate): the actual filtering/forwarding
  # chokepoint code-docker-netinit's and dind's own routing loops (above)
  # point their default route at, via the `router` alias. DNS-level
  # content-blocklist (dnsmasq), RFC1918/CIDR FORWARD filtering, and inbound
  # port-forwarding (DNAT) all live in this one container - see
  # docs/egress-netgate.md for the full design/reasoning, and CLAUDE.md's
  # "egress lockdown (netgate)" section for the short version.
  #
  # The service itself is defined in router/docker-compose.router.yml (see
  # the `router` include below), not here - router/ is its own standalone
  # project (qwreey/router-docker), brought in as a git submodule, and code-
  # docker only supplies the fields whose relative paths (env_file, volumes'
  # bind-mount source) need to resolve against THIS file's own location
  # rather than the fragment's - see each field's own comment below. This
  # merges onto the code-docker-router service the fragment defines, same
  # technique already proven for EXTRA_INCLUDE overlays (see
  # .claude/archive/roblox-studio-vnc-isolation-plan-done.md) - a file
  # doesn't need to originally define a service to add fields to it.
  # Confirmed via `docker compose config` that this merge (fragment fields +
  # these two) resolves to the exact same service as the old fully-inline
  # definition.
  code-docker-router:
    # router's own feature-specific settings (tailscale, Dev Proxy exposure
    # policy, router-manager's own admin-API password, tinyauth, /exports/
    # allowlists) all live in .env.router, not here - copy
    # router/example-env.router to .env.router and uncomment only what you
    # need (every value already has a sane default), same pattern as
    # code-docker's own .env.webmanager below/above. Migrated the same way
    # too (`router-manager --env-migrate`, see router/example-env.router's
    # own doc comment).
    #
    # Deliberately NOT "router/.env.router" (what you'd naively write given
    # the template file it's copied from lives under router/) - env_file
    # paths are relative to wherever the file that DECLARES them lives, and
    # this one's declared here (not in router/docker-compose.router.yml) so
    # it stays relative to THIS file - which in the recommended
    # split-directory deploy (docs/index.md: clone into builds/code-docker/,
    # copy docker-compose.yml out one level) is a different directory than
    # the router/ subtree - and required: false means a missing file there
    # is never reported, so a "router/.env.router" path would silently never
    # be read. Flat and colocated with .env/.env.webmanager instead: nothing
    # under builds/ needs touching to set a router value, matching how those
    # two are already handled.
    env_file:
      - path: .env.router
        required: false
    volumes:
      # Persistent state for router's own features (tailscale login
      # state/config.yaml, caddy-adapter's managed/custom Caddyfile
      # fragments) - router has no /code volume of its own (that's
      # code-docker's), so this is its equivalent. Declared here rather than
      # in router/docker-compose.router.yml because a relative
      # `./data/router` needs to resolve against wherever THIS file sits
      # (data/ deliberately lives outside the source checkout, independent
      # of BUILD_CONTEXT - see root CLAUDE.md's "Build (Dockerfile)"
      # section) - `docker compose config` confirmed declaring it in the
      # fragment instead resolves to router/data/router, which is wrong.
      - "${ROUTER_VOLUME:-./data/router}:/var/lib/code-docker-router"
