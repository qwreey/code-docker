networks:
  code-docker-internal:
    name: "${PREFIX:-}code-docker-internal"
    internal: true
    # Requires ipv6 support enabled in the docker engine daemon.json - see
    # example-env before enabling.
    enable_ipv6: ${ENABLE_IPV6:-false}
  code-docker-external:
    name: "${PREFIX:-}code-docker-external"
    internal: false
    enable_ipv6: ${ENABLE_IPV6:-false}
  code-docker-forwards:
    # Dedicated network for the tailscale `forwards:` feature (config.yaml's
    # socat listeners that pull a remote tailnet peer's port in). Kept
    # separate from code-docker-internal so forwards/publish don't share a
    # port namespace.
    name: "${PREFIX:-}code-docker-forwards"
    internal: true
    enable_ipv6: ${ENABLE_IPV6:-false}

services:
  code-docker:
    container_name: "${PREFIX:-}code-docker"
    hostname: code-docker
    build:
      # Defaults to "." (this docker-compose.yml living next to the repo).
      # If you cloned this docker-compose file to outside the repo (ex:
      # builds/code-docker), set BUILD_CONTEXT in .env instead of editing
      # this file - see example-env.
      context: "${BUILD_CONTEXT:-.}"
      # Name resolution can fail if the host uses something like Tailscale,
      # so we work around this by using the host network only at build time.
      network: host
    restart: unless-stopped
    # What each of these does, its default, and how to override it all live
    # in example-env (copy it to .env) - kept terse here to avoid
    # documenting the same variable in two places.
    environment:
      PWA_NAME: "${PWA_NAME:-code-docker}"
      PWA_SHORT_NAME: "${PWA_SHORT_NAME:-code-docker}"
      TZ: "${TZ:-}"
      LANG: "${LANG:-}"
      # Default matches the "dind" alias below - see example-env before
      # overriding.
      DOCKER_HOST: "${DOCKER_HOST:-tcp://dind:2375}"
      TAILSCALE_ENABLED: "${TAILSCALE_ENABLED:-true}"
      TAILSCALE_LOGIN_SERVER: "${TAILSCALE_LOGIN_SERVER:-}"
      # Empty falls back to tailscaled's own os.Hostname() default, which is
      # this container's `hostname:` below - fixed to "code-docker" and NOT
      # PREFIX-namespaced, so multiple instances on one tailnet collide on
      # MagicDNS name unless set explicitly per instance. See example-env.
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME:-}"
      NGINX_LOG_LEVEL: "${NGINX_LOG_LEVEL:-errors}"
      CODE_SERVER_BIND_ADDR: "${CODE_SERVER_BIND_ADDR:-private:8080}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      NGINX_BLOCK_LOOPBACK: "${NGINX_BLOCK_LOOPBACK:-true}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      VECTOR_LOG_LEVEL: "${VECTOR_LOG_LEVEL:-warn}"
      TAILSCALE_LOG_LEVEL: "${TAILSCALE_LOG_LEVEL:-errors}"
      WEBMANAGER_ENV_TEMPLATE_PATH: "${WEBMANAGER_ENV_TEMPLATE_PATH:-/etc/code-docker/webmanager/example-env.webmanager}"
      # Internal Caddy instance for exposing dev servers - see
      # docs/dev-proxy.md. Each expose carries its own full hostname
      # (set per-expose in webmanager's Dev Proxy tab), so no domain env var
      # is needed here - CADDY_ADAPTER_ENABLED just opts the whole feature
      # in/out.
      CADDY_ADAPTER_ENABLED: "${CADDY_ADAPTER_ENABLED:-true}"
      CADDY_ADAPTER_PORT: "${CADDY_ADAPTER_PORT:-8082}"
    # webmanager(admin panel, port 81) settings all live in .env.webmanager,
    # not here - copy example-env.webmanager to .env.webmanager and uncomment
    # only what you need (every value already has a sane default). See the
    # webmanager section of README.md for what each tab does.
    env_file:
      - path: .env.webmanager
        required: false
    networks:
      code-docker-external: {}
      code-docker-internal:
        # Self-IP alias for the tailscale `publish:` feature (config.yaml's
        # `tailscale serve` targets). tailscaled auto re-exposes anything
        # bound to loopback/0.0.0.0 to the whole tailnet regardless of ACLs,
        # so services meant to be published deliberately (not automatically)
        # should bind here instead.
        aliases:
          - private
      code-docker-forwards:
        # Self-IP alias for the tailscale `forwards:` feature (config.yaml's
        # socat listeners) - same loopback-avoidance reasoning as `private`,
        # on its own network so local ports can't collide between forwards:
        # and publish:.
        aliases:
          - forward
    ports:
      # Expose port 80 (HTTP) externally through a reverse proxy,
      # or expose it directly, but be mindful of security settings.
      # It's recommended to use a reverse proxy with forward proxy auth
      # where possible, e.g. a web server like Caddy combined with an
      # authentication tool like Authentik.
      # An in-container nginx (see config/nginx.default.conf) now splits this
      # single port between code-server (/) and webmanager (/manager) - no
      # separate port needed for webmanager anymore.
      - 80:80
      # - 22:22
      # webmanager no longer needs its own published port - it's reachable at
      # /manager on port 80 above (nginx strips the prefix internally).
      # Uncomment this (and set WEBMANAGER_ADDR=:81 in .env.webmanager) only
      # if you want to bypass nginx and reach it directly on its own port.
      # - 81:81
      # Internal Caddy dev-proxy listener (see docs/dev-proxy.md) - point
      # your outer reverse proxy's wildcard subdomain block here instead of
      # publishing it directly, same "reverse proxy in front" recommendation
      # as port 80 above. Not published by default since exposure strategy
      # is up to your own deployment (shared docker network vs host port).
      # - 8082:8082
    volumes:
      - "${HOME_VOLUME:-./code}:/code"
      - "${SSHD_VOLUME:-./sshd}:/etc/ssh"
    cap_add:
      # Needed for debugging tools that trace other processes, e.g. gdb, btop
      - SYS_PTRACE
      # Avoids IPC-related performance bottlenecks, since IDEs make heavy
      # use of IPC (extensions, LSP, etc.)
      - IPC_LOCK
    # Change max logging size
    # Please note that without this setting,
    # log files could grow to tens of gigabytes in size.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Max size of a single log file
        max-file: "3"    # Keep a maximum of 3 rotated files
    # Use graphic backend. code-docker doesn't require this but
    # you can enable this if you need
    #devices:
    #  - /dev/dri:/dev/dri
    #  - /dev/kfd:/dev/kfd
    #group_add:
    #  - video
    #  - render

  # Create docker in docker daemon. for creating dev dockers (redis, postgres, ...)
  # WARNING: this daemon is privileged and has no auth/TLS on its socket.
  # Anyone who can reach it can create privileged containers and effectively
  # gain root on the host. dind-entrypoint.sh binds it to code-docker-internal
  # only (not code-docker-external, see below), but treat code-docker-internal
  # itself as fully trusted.
  code-docker-dind:
    container_name: "${PREFIX:-}code-docker-dind"
    hostname: code-docker-dind
    build:
      # Same reasoning as code-docker's context above: set BUILD_CONTEXT in
      # .env instead of editing this file.
      context: "${BUILD_CONTEXT:-.}"
      network: host
      target: dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Persist pulled images/containers across restarts
      - "${DIND_VOLUME:-./dind}:/var/lib/docker"
    networks:
      code-docker-internal:
        # Extra name that only resolves on this network, so code-docker
        # (which is also on code-docker-external) can reach this daemon
        # unambiguously - see DOCKER_HOST above.
        aliases:
          - dind
      # code-docker-internal has no route to the internet, so this is
      # needed for `docker pull` to work.
      code-docker-external: {}
    command: ["--log-level=warn"]
